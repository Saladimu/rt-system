<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- 1. Meta Redirect (Works instantly for most browsers) -->
    <meta http-equiv="refresh" content="0; url=https://saladimu.github.io/rtlontar/public.html">
</head>
<body>
    <!-- 2. JavaScript Fallback (In case meta refresh fails) -->
    <script>
        window.location.href = "https://saladimu.github.io/rtlontar/public.html";
    </script>

    <!-- 3. Manual Link Fallback (For accessibility) -->
    <p>If you are not redirected automatically, follow this <a href="https://saladimu.github.io/rtlontar/public.html">link to the Public Portal</a>.</p>
</body>
</html>
